[project]
name = "local-rag"
version = "1.0.1"
description = "Zero-cost, provider-swappable RAG with Ollama and Qdrant"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Sanjay Srinivas" }]
dependencies = [
  "fastapi>=0.116",
  "httpx>=0.28",
  "langchain-text-splitters>=1.1.2",
  "markdown-it-py>=4.2.0",
  "pydantic>=2.11",
  "pymupdf4llm>=1.28.2",
  "python-multipart>=0.0.20",
  "qdrant-client>=1.18",
  "rank-bm25>=0.2.2",
  "rapidocr>=3.9.2",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
evaluation = [
  "langchain-community<0.4",
  "openai>=2.0",
  "ragas==0.3.9",
]

[project.scripts]
local-rag = "local_rag.api:main"
local-rag-eval = "local_rag.evaluation:main"
local-rag-eval-data = "local_rag.evaluation_data:main"
local-rag-eval-ragas = "local_rag.ragas_evaluation:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: fast tests with no external services",
  "integration: tests that exercise local infrastructure",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = false

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
allow_zero_version = true
commit_message = "chore(release): {version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[dependency-groups]
dev = [
  "commitizen==4.18.0",
  "mypy==2.3.1",
  "nox==2026.8.17",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-asyncio>=1.1",
  "pytest-cov==7.1.0",
  "pyyaml>=6.0.2",
  "python-semantic-release==10.6.1",
  "ruff==0.16.3",
]
